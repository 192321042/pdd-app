name: Mobile Appium E2E Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-and-suite-300:
    name: Run 300 Test Cases Suite & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Install Dependencies
        run: |
          cd automation
          npm install

      - name: Execute 300 Test Suite & Generate Excel Reports
        run: |
          cd automation
          npm run test:300
          node generate_300_test_report.js

      - name: Upload 300 Test Suite Excel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 300-test-cases-excel-report
          path: |
            automation/excel/Mobile_E2E_Report_300_Passed.xlsx
            automation/excel/OmniGuard_TestReport_300_Passed.xlsx

  e2e-tests:
    name: Run Appium E2E Tests on Android Emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          sudo echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm $USER

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          script: |
            # Ensure ANDROID_HOME environment variables are explicitly exported for Appium
            export ANDROID_HOME=$ANDROID_SDK_ROOT
            export PATH=$ANDROID_HOME/platform-tools:$PATH

            # Ensure emulator is fully booted and ADB is online
            adb wait-for-device
            adb shell input keyevent 82 || true

            # Install automation dependencies (includes local appium)
            cd automation
            npm install
            
            # Install Appium UiAutomator2 driver
            npx appium driver install uiautomator2 || true
            
            # Start Appium Server in Background with base-path
            mkdir -p logs
            npx appium --base-path / --log logs/appium-server.log &
            
            # Wait for Appium Server to start listening
            sleep 15
            
            # Run test suite
            export EXECUTION_MODE=APK
            export APK_PATH="../app/build/outputs/apk/debug/app-debug.apk"
            set +e
            npm test
            TEST_EXIT_CODE=$?
            
            # Generate GitHub Actions Job Summary with test results
            node utilities/generate_github_summary.js || true
            
            # Exit with original test suite status code
            exit $TEST_EXIT_CODE

      - name: Upload Test Reports and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-execution-reports
          path: |
            automation/reports/
            automation/excel/
            automation/logs/
