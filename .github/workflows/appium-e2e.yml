name: Mobile Appium E2E Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: macos-latest # macOS is required to spawn HAXM/virtualization emulator cleanly on GitHub Actions runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run E2E Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: arm64-v8a
          profile: pixel
          script: |
            # Install automation dependencies (includes local appium)
            cd automation
            npm install
            
            # Install Appium driver
            npx appium driver install uiautomator2
            
            # Start Appium Server in Background
            mkdir -p logs
            npx appium --log logs/appium-server.log &
            
            # Wait for Appium Server to start
            sleep 10
            
            # Run test suite
            export EXECUTION_MODE=APK
            export APK_PATH="../app/build/outputs/apk/debug/app-debug.apk"
            set +e
            npm test
            TEST_EXIT_CODE=$?
            
            # Generate GitHub Actions Job Summary with test results
            node utilities/generate_github_summary.js
            
            # Exit with original test suite status code
            exit $TEST_EXIT_CODE

      - name: Upload Test Reports and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-execution-reports
          path: |
            automation/reports/
            automation/excel/Mobile_E2E_Report.xlsx
            automation/logs/
