name: Android Appium E2E Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-mobile-tests:
    name: Appium Mobile E2E Testing
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Automation Dependencies
        run: |
          cd automation
          npm install

      - name: Run 300 E2E Test Suite & Generate Excel Reports
        run: |
          cd automation
          npm run test:300
          node generate_300_test_report.js

      - name: Build Android App (APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: |
            # Start Appium server in background
            cd automation
            npx appium --log appium.log &
            # Wait for Appium server to start
            until curl -s http://localhost:4723/status; do
              sleep 1
            done
            # Run live Appium login & form test suites
            npm run test:login
            npm run test:form

      - name: Generate GitHub Step Summary Report
        if: always()
        run: |
          cd automation
          node utilities/generate_github_summary.js || true

      - name: Upload E2E Test Reports & Excel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Appium-Reports-And-Excel-Sheets
          path: |
            automation/reports/
            automation/excel/Mobile_E2E_Report_300_Passed.xlsx
            automation/excel/OmniGuard_TestReport_300_Passed.xlsx
            automation/excel/Mobile_E2E_Report.xlsx
            automation/excel/
