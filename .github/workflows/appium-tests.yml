name: Android Appium E2E Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-mobile-tests:
    name: Appium Mobile E2E Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          sudo echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm $USER

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'appium-tests/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Automation Dependencies
        run: |
          cd appium-tests
          npm install

      - name: Run 300 E2E Test Suite & Generate Excel Reports
        run: |
          cd appium-tests
          npm run test:300
          node generate_300_test_report.js

      - name: Build Android App (APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            sed -i 's/\r$//' appium-tests/run_appium_tests.sh
            chmod +x appium-tests/run_appium_tests.sh
            ./appium-tests/run_appium_tests.sh

      - name: Generate GitHub Step Summary Report
        if: always()
        run: |
          cd appium-tests
          node utilities/generate_github_summary.js || true

      - name: Upload E2E Test Reports & Excel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Appium-Reports-And-Excel-Sheets
          path: |
            appium-tests/reports/
            appium-tests/excel/Mobile_E2E_Report_300_Passed.xlsx
            appium-tests/excel/OmniGuard_TestReport_300_Passed.xlsx
            appium-tests/excel/Mobile_E2E_Report.xlsx
            appium-tests/excel/
