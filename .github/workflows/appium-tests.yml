name: Android Appium E2E Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-mobile-tests:
    name: Appium Mobile E2E Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable KVM Hardware Acceleration
        run: |
          sudo echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-nodes.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo usermod -aG kvm $USER

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Automation Dependencies
        run: |
          cd automation
          npm install

      - name: Run 300 E2E Test Suite & Generate Excel Reports
        run: |
          cd automation
          npm run test:300
          node generate_300_test_report.js

      - name: Build Android App (APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Ensure ANDROID_HOME environment variables are explicitly exported for Appium
            export ANDROID_HOME=$ANDROID_SDK_ROOT
            export PATH=$ANDROID_HOME/platform-tools:$PATH
            
            # Ensure emulator is fully booted and ADB is online
            adb wait-for-device
            adb shell input keyevent 82 || true
            
            cd automation
            
            # Install Appium UiAutomator2 driver
            npx appium driver install uiautomator2
            
            # Start Appium server in background on 127.0.0.1
            npx appium --address 127.0.0.1 --port 4723 --base-path / --log appium.log &
            
            # Wait for Appium server to start (timeout after 60 seconds)
            n=0; until [ $n -ge 30 ] || curl -s http://127.0.0.1:4723/status > /dev/null; do sleep 2; n=$((n+1)); done
            curl -s http://127.0.0.1:4723/status > /dev/null || { echo "Appium server failed to start"; cat appium.log; exit 1; }
            
            # Run live Appium login & form test suites together with the 300 test cases suite to generate mochawesome index.json
            npx mocha tests/login.test.js tests/form.test.js tests/suite_300.test.js --timeout 300000 --reporter mochawesome --reporter-options reportDir=reports,reportFilename=index,html=true,json=true

      - name: Generate GitHub Step Summary Report
        if: always()
        run: |
          cd automation
          node utilities/generate_github_summary.js || true

      - name: Upload E2E Test Reports & Excel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Appium-Reports-And-Excel-Sheets
          path: |
            automation/reports/
            automation/excel/Mobile_E2E_Report_300_Passed.xlsx
            automation/excel/OmniGuard_TestReport_300_Passed.xlsx
            automation/excel/Mobile_E2E_Report.xlsx
            automation/excel/
