name: selenium-tests.yml

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-deploy:
    name: test-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Automation Dependencies
        run: |
          cd automation
          npm install

      - name: Execute 300 E2E Selenium & Mobile Test Suite
        run: |
          cd automation
          npm run test:300
          node generate_300_test_report.js

      - name: Generate GitHub Step Summary Report
        run: |
          cd automation
          node utilities/generate_github_summary.js || true

      - name: Upload E2E Selenium Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Selenium-Report
          path: |
            automation/reports/
            automation/excel/Mobile_E2E_Report_300_Passed.xlsx

      - name: Upload QA Test Case Suites Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Test-Case-Suites
          path: |
            automation/tests/
            automation/excel/OmniGuard_TestReport_300_Passed.xlsx
            automation/excel/
