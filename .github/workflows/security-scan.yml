name: Vulnerability & Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'automation/package.json'

      - name: Install Dependencies
        run: |
          cd automation
          npm install

      - name: Run NPM Audit (Dependency Vulnerability Scan)
        run: |
          cd automation
          npm audit --audit-level=high || true

      - name: Run Trivy Security Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'HIGH,CRITICAL'

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-Vulnerability-Reports
          path: trivy-results.txt
